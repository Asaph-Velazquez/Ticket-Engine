openapi: 3.0.3
info:
  title: Ticket Engine — Módulo 4
  version: 2.0.0
  description: >-
    Emisión inmutable de un boleto al unir el pago confirmado del Módulo 3 con el
    detalle de reserva del Módulo 2 (por reservationId). ES256/P-256, idempotencia
    por paymentId y exclusión por eventId+seatId. Solo comunicación HTTP entre
    módulos. OpenAPI también disponible en /openapi.yaml. La verificación no
    consume el boleto ni sustituye el control de acceso del Módulo 6.
servers:
  - url: http://localhost:8084
    description: Backend Docker local
tags:
  - name: Emisión
  - name: Administración
  - name: Verificación
  - name: Wallet
paths:
  /webhooks/payments/confirmed:
    post:
      tags: [Emisión]
      operationId: confirmPayment
      summary: Recibir el pago confirmado del Módulo 3
      description: >-
        HMAC-SHA256 sobre UTF8(timestamp + '.') concatenado con los bytes JSON
        exactos, con el secreto de pagos (texto UTF-8). Timestamp epoch en segundos
        dentro de ±300 segundos. Autenticación antes de parsear JSON. Máximo 32768
        bytes. El pago se une con el detalle del Módulo 2 por reservationId; si el
        detalle aún no llega responde 202 PENDING_RESERVATION y el boleto se emite
        cuando llegue. Reenviar el mismo mensaje es idempotente.
      security:
        - paymentSignature: []
          paymentTimestamp: []
      requestBody:
        $ref: '#/components/requestBodies/PaymentConfirmed'
      responses:
        '201':
          $ref: '#/components/responses/IntakeIssued'
        '200':
          $ref: '#/components/responses/IntakeReplayed'
        '202':
          $ref: '#/components/responses/IntakePending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        default:
          $ref: '#/components/responses/Error'
  /webhooks/reservations/confirmed:
    post:
      tags: [Emisión]
      operationId: confirmReservation
      summary: Recibir el detalle de evento y asiento del Módulo 2
      description: >-
        Mismo esquema HMAC que pagos pero con secreto propio y encabezados
        X-Reservation-Timestamp / X-Reservation-Signature. Si el pago aún no llega
        responde 202 PENDING_PAYMENT. Una reserva nueva debe terminar en el futuro
        y dentro de cinco años.
      security:
        - reservationSignature: []
          reservationTimestamp: []
      requestBody:
        $ref: '#/components/requestBodies/ReservationDetails'
      responses:
        '201':
          $ref: '#/components/responses/IntakeIssued'
        '200':
          $ref: '#/components/responses/IntakeReplayed'
        '202':
          $ref: '#/components/responses/IntakePending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        default:
          $ref: '#/components/responses/Error'
  /api/wallet/{buyerId}/tickets:
    get:
      tags: [Wallet]
      operationId: walletTickets
      summary: Boletos de un comprador en el formato del Módulo 5
      description: >-
        Exige el Bearer de la Wallet (distinto del administrativo). signatureECDSA
        es el JWS ES256 completo; se verifica con publicKeyJwk. date es la fecha de
        inicio en America/Mexico_City (dd/MM/yyyy). status es ACTIVO o VENCIDO.
        No incluye skSession: la clave de sesión del QR dinámico la genera el Módulo 5.
      security:
        - walletBearer: []
      parameters:
        - in: path
          name: buyerId
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$'}
      responses:
        '200':
          description: Boletos del comprador (hasta 200)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /api/tickets:
    post:
      tags: [Emisión]
      operationId: emitTicket
      summary: Alias de /webhooks/payments/confirmed, con la misma autenticación HMAC
      security:
        - paymentSignature: []
          paymentTimestamp: []
      requestBody:
        $ref: '#/components/requestBodies/PaymentConfirmed'
      responses:
        '201':
          $ref: '#/components/responses/IntakeIssued'
        '200':
          $ref: '#/components/responses/IntakeReplayed'
        '202':
          $ref: '#/components/responses/IntakePending'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags: [Administración]
      operationId: listTickets
      summary: Listar boletos emitidos, del más reciente al más antiguo
      security:
        - adminBearer: []
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - in: query
          name: offset
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Página de boletos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /api/tickets/{ticketId}:
    get:
      tags: [Administración]
      operationId: getTicket
      summary: Recuperar el boleto inmutable y su token original
      security:
        - adminBearer: []
      parameters:
        - in: path
          name: ticketId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Boleto emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: TICKET_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/demo/tickets:
    post:
      tags: [Administración]
      operationId: createDemoTicket
      summary: Emitir un boleto sandbox desde el panel interno
      description: >-
        Exclusivo para demostraciones. orderId y reservationId son opcionales; si se omiten se derivan del paymentId. Exige Bearer administrativo y la propiedad
        ticket.demo-enabled=true, deshabilitada por defecto en la aplicación.
        No comprueba una transacción real de pago; usa la misma lógica de firma,
        idempotencia e inmutabilidad. No habilitar en producción.
      security:
        - adminBearer: []
      requestBody:
        $ref: '#/components/requestBodies/Demo'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '200':
          $ref: '#/components/responses/Replayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sandbox deshabilitado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'
  /api/system:
    get:
      tags: [Administración]
      operationId: getSystem
      summary: Consultar metadatos públicos y estado del modo sandbox
      security:
        - adminBearer: []
      responses:
        '200':
          description: Configuración de integración, sin secretos
          content:
            application/json:
              schema:
                type: object
                required: [issuer, audience, keyId, demoEnabled]
                properties:
                  issuer: {type: string, example: ticket-engine}
                  audience: {type: string, example: ticket-wallet-access}
                  keyId: {type: string}
                  demoEnabled: {type: boolean}
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /public-key:
    get:
      tags: [Verificación]
      operationId: getPublicKey
      summary: Descargar la llave pública como JWK EC P-256
      security: []
      responses:
        '200':
          description: Solo parámetros públicos, nunca la coordenada privada d
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJwk'
  /.well-known/jwks.json:
    get:
      tags: [Verificación]
      operationId: getJwks
      summary: Descargar JWKS para verificadores estándar
      security: []
      responses:
        '200':
          description: Conjunto de llaves públicas del emisor
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicJwk'
  /verify:
    post:
      tags: [Verificación]
      operationId: verifyTicket
      summary: Verificar firma ES256 y claims sin consultar la base de datos
      description: >-
        Verifica firma y perfil v2 (o v1 para boletos previos a la integración), emisor, audiencia, identificadores, estado y
        vigencia. Siempre usar HTTP200 para tokens de formato/firma/claims inválidos.
        Requests JSON inválidos o sin token reciben400. No registra acceso de puerta.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, minLength: 1, maxLength: 24000}
      responses:
        '200':
          description: Resultado sin payload si la firma o los claims son inválidos
          content:
            application/json:
              schema:
                type: object
                required: [valid, reason]
                properties:
                  valid: {type: boolean}
                  reason:
                    type: string
                    enum: [VALID, INVALID_SIGNATURE_OR_FORMAT, INVALID_CLAIMS_OR_VALIDITY]
                  payload:
                    type: object
                    nullable: true
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/TooLarge'
        default:
          $ref: '#/components/responses/Error'
  /actuator/health:
    get:
      operationId: health
      summary: Salud de aplicación y PostgreSQL, sin detalles internos
      security: []
      responses:
        '200':
          description: Saludable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: UP}
        '503':
          description: Servicio no saludable
  /openapi.yaml:
    get:
      operationId: openapi
      summary: Descargar este contrato
      security: []
      responses:
        '200':
          description: Especificación OpenAPI
          content:
            application/yaml:
              schema: {type: string}
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Token administrativo interno montado como secreto. No es un JWT ni una credencial del comprador.
    paymentSignature:
      type: apiKey
      in: header
      name: X-Payment-Signature
      description: Hexadecimal HMAC-SHA256, 64 caracteres, calculado sobre timestamp+'.'+rawBody.
    paymentTimestamp:
      type: apiKey
      in: header
      name: X-Payment-Timestamp
      description: Epoch en segundos, ventana absoluta de 300 segundos.
    reservationSignature:
      type: apiKey
      in: header
      name: X-Reservation-Signature
      description: HMAC-SHA256 hexadecimal con el secreto propio del Módulo 2.
    reservationTimestamp:
      type: apiKey
      in: header
      name: X-Reservation-Timestamp
      description: Epoch en segundos, ventana absoluta de 300 segundos.
    walletBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Token de servicio del Módulo 5, distinto del administrativo.
  requestBodies:
    PaymentConfirmed:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentConfirmedMessage'
          example:
            event: payment.confirmed
            sourceModule: M3_PAYMENTS
            targetModule: M4_TICKET_ISSUANCE
            payload:
              paymentId: pay_01J9X8K2M4N6P8Q0R2S4T6V8W0
              orderId: ord_01J9X8J9A1B2C3D4E5F6G7H8J9
              reservationId: res_778899
              buyerId: usr_102938
              amountMinor: 125000
              currency: MXN
              paymentStatus: PAID
              paidAt: '2026-11-19T19:50:00Z'
    ReservationDetails:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReservationDetails'
          example:
            reservationId: res_778899
            eventId: id-del-evento
            seatId: A-12
            eventName: Noche de concierto
            venue: Auditorio Central
            eventStartsAt: '2030-01-01T19:00:00Z'
            eventEndsAt: '2030-01-01T22:00:00Z'
    Demo:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TicketIssueRequest'
  responses:
    IntakeIssued:
      description: Boleto emitido por este mensaje (status=ISSUED, replayed=false)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntakeResult'
    IntakeReplayed:
      description: Mensaje repetido; boleto original (status=ISSUED, replayed=true)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntakeResult'
    IntakePending:
      description: Mensaje guardado; falta el del otro módulo (PENDING_RESERVATION o PENDING_PAYMENT, ticket=null)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntakeResult'
    Created:
      description: Boleto emitido, replayed=false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmissionResult'
    Replayed:
      description: Boleto original recuperado, replayed=true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmissionResult'
    BadRequest:
      description: INVALID_REQUEST — JSON, campos, fechas o paginación inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: UNAUTHORIZED, INVALID_PAYMENT_AUTH o INVALID_RESERVATION_AUTH — autenticación ausente, inválida o fuera de ventana
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: PAYMENT_CONFLICT, RESERVATION_CONFLICT, RESERVATION_ALREADY_PAID o SEAT_ALREADY_ISSUED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: BODY_TOO_LARGE — límite de 32 KiB excedido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      description: Error seguro; 415 para Content-Type inválido, 503 persistencia, 500 fallo interno
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ExternalId:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$'
      maxLength: 64
    PaymentConfirmedMessage:
      type: object
      additionalProperties: false
      required: [event, sourceModule, targetModule, payload]
      properties:
        event: {type: string, enum: [payment.confirmed]}
        sourceModule: {type: string, enum: [M3_PAYMENTS]}
        targetModule: {type: string, enum: [M4_TICKET_ISSUANCE]}
        payload:
          type: object
          additionalProperties: false
          required: [paymentId, orderId, reservationId, buyerId, amountMinor, currency, paymentStatus, paidAt]
          properties:
            paymentId: {$ref: '#/components/schemas/ExternalId'}
            orderId: {$ref: '#/components/schemas/ExternalId'}
            reservationId: {$ref: '#/components/schemas/ExternalId'}
            buyerId: {$ref: '#/components/schemas/ExternalId'}
            amountMinor: {type: integer, format: int64, minimum: 0, maximum: 9999999999999}
            currency: {type: string, pattern: '^[A-Z]{3}$', description: Código ISO4217 válido.}
            paymentStatus: {type: string, enum: [PAID]}
            paidAt: {type: string, format: date-time, description: No más de 300 segundos en el futuro.}
    ReservationDetails:
      type: object
      additionalProperties: false
      required: [reservationId, eventId, seatId, eventName, venue, eventStartsAt, eventEndsAt]
      properties:
        reservationId: {$ref: '#/components/schemas/ExternalId'}
        eventId: {$ref: '#/components/schemas/ExternalId'}
        seatId: {$ref: '#/components/schemas/ExternalId'}
        eventName: {type: string, minLength: 1, maxLength: 140}
        venue: {type: string, minLength: 1, maxLength: 140}
        eventStartsAt: {type: string, format: date-time}
        eventEndsAt: {type: string, format: date-time, description: Posterior al inicio; futura y dentro de cinco años.}
    TicketIssueRequest:
      type: object
      additionalProperties: false
      required: [paymentId, eventId, buyerId, seatId, eventName, venue, eventStartsAt, eventEndsAt, amountMinor, currency, paymentStatus]
      properties:
        paymentId: {$ref: '#/components/schemas/ExternalId'}
        eventId: {$ref: '#/components/schemas/ExternalId'}
        buyerId: {$ref: '#/components/schemas/ExternalId'}
        seatId: {$ref: '#/components/schemas/ExternalId'}
        eventName: {type: string, minLength: 1, maxLength: 140}
        venue: {type: string, minLength: 1, maxLength: 140}
        eventStartsAt: {type: string, format: date-time}
        eventEndsAt: {type: string, format: date-time}
        amountMinor: {type: integer, format: int64, minimum: 0, maximum: 9999999999999}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        paymentStatus: {type: string, enum: [PAID]}
        orderId: {$ref: '#/components/schemas/ExternalId'}
        reservationId: {$ref: '#/components/schemas/ExternalId'}
    IntakeResult:
      type: object
      required: [status, reservationId, ticket, replayed]
      properties:
        status: {type: string, enum: [ISSUED, PENDING_RESERVATION, PENDING_PAYMENT]}
        reservationId: {type: string}
        ticket:
          type: object
          nullable: true
          description: Boleto emitido (esquema Ticket); null mientras el estado es PENDING_*.
          allOf:
            - $ref: '#/components/schemas/Ticket'
        replayed: {type: boolean}
    WalletResponse:
      type: object
      required: [tickets, publicKeyJwk]
      properties:
        tickets:
          type: array
          items:
            type: object
            required: [ticketId, event, date, seat, titular, status, signatureECDSA]
            properties:
              ticketId: {type: string, format: uuid}
              event: {type: string, example: Noche de concierto}
              date: {type: string, example: 01/01/2030, description: dd/MM/yyyy en America/Mexico_City.}
              seat: {type: string, example: A-12}
              titular: {type: string, example: usr_102938, description: buyerId del Módulo 3.}
              status: {type: string, enum: [ACTIVO, VENCIDO]}
              signatureECDSA: {type: string, description: JWS compacto ES256 completo.}
        publicKeyJwk:
          type: object
          required: [kty, crv, x, y]
          properties:
            kty: {type: string, enum: [EC]}
            crv: {type: string, enum: [P-256]}
            x: {type: string}
            y: {type: string}
    Ticket:
      type: object
      required: [ticketId, paymentId, eventId, buyerId, seatId, eventName, venue, eventStartsAt, eventEndsAt, issuedAt, expiresAt, status, token, payloadHash, keyId, payloadJson]
      properties:
        ticketId: {type: string, format: uuid}
        paymentId: {type: string}
        eventId: {type: string}
        buyerId: {type: string}
        orderId: {type: string, nullable: true, description: Nulo solo en boletos previos a la integración.}
        reservationId: {type: string, nullable: true, description: Nulo solo en boletos previos a la integración.}
        seatId: {type: string}
        eventName: {type: string}
        venue: {type: string}
        eventStartsAt: {type: string, format: date-time}
        eventEndsAt: {type: string, format: date-time}
        issuedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        status: {type: string, enum: [ISSUED]}
        token: {type: string, description: JWS compacto ES256 exacto persistido.}
        payloadHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        keyId: {type: string, description: Thumbprint JWK SHA-256 base64url.}
        payloadJson: {type: string, description: Payload canónico UTF-8 representado como cadena JSON.}
    EmissionResult:
      type: object
      required: [ticket, replayed]
      properties:
        ticket:
          $ref: '#/components/schemas/Ticket'
        replayed: {type: boolean}
    TicketPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        total: {type: integer, format: int64}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0}
    PublicJwk:
      type: object
      additionalProperties: false
      required: [kty, crv, alg, use, kid, x, y, key_ops]
      properties:
        kty: {type: string, enum: [EC]}
        crv: {type: string, enum: [P-256]}
        alg: {type: string, enum: [ES256]}
        use: {type: string, enum: [sig]}
        kid: {type: string}
        x: {type: string, description: Coordenada pública de 32 bytes base64url sin padding.}
        y: {type: string, description: Coordenada pública de 32 bytes base64url sin padding.}
        key_ops:
          type: array
          items: {type: string, enum: [verify]}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
