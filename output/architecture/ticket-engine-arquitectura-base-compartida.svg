<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef5fb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b4f93"/>
      <stop offset="1" stop-color="#0b2f6b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1aa6c8"/>
      <stop offset="1" stop-color="#1681b5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#11365d" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2d6c99"/>
    </marker>
    <marker id="arrowWarn" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#c57b17"/>
    </marker>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #082b60; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #47657e; }
      .section { font: 700 18px Arial, sans-serif; fill: #ffffff; }
      .nodeTitle { font: 700 17px Arial, sans-serif; fill: #092e64; }
      .nodeText { font: 400 14px Arial, sans-serif; fill: #284761; }
      .small { font: 400 12px Arial, sans-serif; fill: #527089; }
      .whiteText { font: 400 14px Arial, sans-serif; fill: #ffffff; }
      .whiteBold { font: 700 15px Arial, sans-serif; fill: #ffffff; }
      .warningTitle { font: 700 17px Arial, sans-serif; fill: #814900; }
      .warningText { font: 400 14px Arial, sans-serif; fill: #704b1b; }
      .arrowLabel { font: 700 12px Arial, sans-serif; fill: #2d6c99; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="12" fill="#0b4f93"/>
  <text x="70" y="70" class="title">Ticket Engine · Arquitectura con base de datos compartida</text>
  <text x="70" y="100" class="subtitle">Módulo 4 · emisión, firma, persistencia y verificación de boletos digitales</text>

  <!-- External providers -->
  <rect x="55" y="155" width="280" height="300" rx="18" fill="#ffffff" stroke="#bcd4e8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="55" y="155" width="280" height="48" rx="18" fill="url(#blue)"/>
  <text x="78" y="186" class="section">Fuentes de información</text>
  <rect x="78" y="225" width="234" height="56" rx="10" fill="#e9f5fb"/>
  <text x="95" y="248" class="nodeTitle">Módulo 3 · Pagos</text>
  <text x="95" y="268" class="nodeText">PAID + paymentId + buyerId</text>
  <rect x="78" y="296" width="234" height="56" rx="10" fill="#e9f5fb"/>
  <text x="95" y="319" class="nodeTitle">Módulo 2 · Eventos</text>
  <text x="95" y="339" class="nodeText">evento, asiento, precio, horario</text>
  <rect x="78" y="367" width="234" height="65" rx="10" fill="#fff4df"/>
  <text x="95" y="390" class="nodeTitle">Otros proveedores</text>
  <text x="95" y="410" class="nodeText">organizadores, importadores</text>
  <text x="95" y="427" class="small">adaptadores por contrato</text>

  <!-- Main M4 boundary -->
  <rect x="390" y="140" width="820" height="535" rx="24" fill="#f5faff" stroke="#4ba3cf" stroke-width="3" filter="url(#shadow)"/>
  <rect x="390" y="140" width="820" height="56" rx="24" fill="url(#blue)"/>
  <text x="420" y="176" class="section">MÓDULO 4 · TICKET ENGINE</text>
  <text x="1010" y="176" class="whiteText">frontera HTTP + contratos</text>

  <!-- API -->
  <rect x="425" y="220" width="350" height="118" rx="15" fill="#ffffff" stroke="#9bc8e2" stroke-width="2"/>
  <text x="448" y="248" class="nodeTitle">API Java · REST + Webhook</text>
  <text x="448" y="275" class="nodeText">TicketController</text>
  <text x="448" y="296" class="nodeText">PaymentWebhookController</text>
  <text x="448" y="317" class="small">HMAC, timestamp y validación HTTP</text>

  <!-- Domain -->
  <rect x="815" y="220" width="350" height="118" rx="15" fill="#0b4f93"/>
  <text x="838" y="248" class="whiteBold">Dominio Kotlin</text>
  <text x="838" y="275" class="whiteText">TicketEmissionService</text>
  <text x="838" y="296" class="whiteText">payload canónico + idempotencia</text>
  <text x="838" y="317" class="whiteText">conflictos de pago y asiento</text>

  <!-- Crypto -->
  <rect x="425" y="380" width="350" height="118" rx="15" fill="#e7f7fb" stroke="#57afc8" stroke-width="2"/>
  <text x="448" y="408" class="nodeTitle">Criptografía Java</text>
  <text x="448" y="435" class="nodeText">TicketCryptoService</text>
  <text x="448" y="456" class="nodeText">JWS ES256 · ECDSA P-256</text>
  <text x="448" y="477" class="small">SHA-256 del payload + JWK público</text>

  <!-- Persistence -->
  <rect x="815" y="380" width="350" height="118" rx="15" fill="#ffffff" stroke="#9bc8e2" stroke-width="2"/>
  <text x="838" y="408" class="nodeTitle">Persistencia Kotlin</text>
  <text x="838" y="435" class="nodeText">TicketRepository · JDBC</text>
  <text x="838" y="456" class="nodeText">migraciones y restricciones</text>
  <text x="838" y="477" class="small">sin UPDATE / DELETE de boletos</text>

  <!-- M4 API outputs -->
  <rect x="425" y="540" width="740" height="88" rx="15" fill="#ffffff" stroke="#9bc8e2" stroke-width="2"/>
  <text x="448" y="568" class="nodeTitle">Contratos del emisor</text>
  <text x="448" y="594" class="nodeText">POST /api/tickets · POST /verify · GET /public-key · GET /.well-known/jwks.json</text>
  <text x="448" y="615" class="small">respuesta 201 nuevo · 200 replay idéntico · 409 conflicto</text>

  <!-- Arrows internal -->
  <path d="M775 279 H815" stroke="#2d6c99" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="784" y="265" class="arrowLabel">DTO</text>
  <path d="M990 338 V380" stroke="#2d6c99" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="1000" y="365" class="arrowLabel">guardar</text>
  <path d="M815 439 H775" stroke="#2d6c99" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="784" y="425" class="arrowLabel">firmar</text>
  <path d="M600 338 V380" stroke="#2d6c99" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="610" y="365" class="arrowLabel">claims</text>

  <!-- Shared database -->
  <rect x="390" y="720" width="820" height="150" rx="22" fill="#102743" stroke="#0b4f93" stroke-width="3" filter="url(#shadow)"/>
  <text x="425" y="758" class="section">BASE DE DATOS COMPARTIDA · PostgreSQL</text>
  <text x="425" y="785" class="whiteText">Esquemas lógicos por módulo + ownership de tablas + roles restringidos</text>
  <rect x="425" y="808" width="180" height="36" rx="8" fill="#1c568b"/>
  <text x="445" y="832" class="whiteText">m1_identity</text>
  <rect x="620" y="808" width="180" height="36" rx="8" fill="#1c568b"/>
  <text x="640" y="832" class="whiteText">m2_events</text>
  <rect x="815" y="808" width="180" height="36" rx="8" fill="#1c568b"/>
  <text x="835" y="832" class="whiteText">m3_payments</text>
  <rect x="1010" y="808" width="160" height="36" rx="8" fill="#1aa6c8"/>
  <text x="1028" y="832" class="whiteBold">m4_tickets</text>
  <path d="M990 498 V720" stroke="#2d6c99" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="1005" y="610" class="arrowLabel">INSERT / SELECT</text>

  <!-- consumers -->
  <rect x="1270" y="190" width="280" height="225" rx="18" fill="#ffffff" stroke="#bcd4e8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1270" y="190" width="280" height="48" rx="18" fill="url(#cyan)"/>
  <text x="1293" y="221" class="section">Consumidores</text>
  <rect x="1293" y="265" width="234" height="55" rx="10" fill="#e9f5fb"/>
  <text x="1310" y="288" class="nodeTitle">Módulo 5 · Wallet</text>
  <text x="1310" y="308" class="nodeText">recibe boleto y JWS</text>
  <rect x="1293" y="335" width="234" height="55" rx="10" fill="#e9f5fb"/>
  <text x="1310" y="358" class="nodeTitle">Módulo 6 · Validador</text>
  <text x="1310" y="378" class="nodeText">verifica firma y claims</text>
  <path d="M1210 330 H1270" stroke="#2d6c99" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="1218" y="315" class="arrowLabel">REST / JWS</text>

  <!-- warning and mitigations -->
  <rect x="55" y="520" width="280" height="350" rx="18" fill="#fff8eb" stroke="#e0a13a" stroke-width="2" filter="url(#shadow)"/>
  <text x="78" y="558" class="warningTitle">Restricción actual</text>
  <text x="78" y="585" class="warningText">Una sola base para todos</text>
  <text x="78" y="606" class="warningText">los módulos aumenta el</text>
  <text x="78" y="627" class="warningText">acoplamiento y el riesgo</text>
  <text x="78" y="648" class="warningText">de acceso cruzado.</text>
  <line x1="78" y1="674" x2="312" y2="674" stroke="#e0a13a" stroke-width="1"/>
  <text x="78" y="703" class="warningTitle">Mitigaciones</text>
  <text x="78" y="730" class="warningText">• esquema propietario M4</text>
  <text x="78" y="753" class="warningText">• roles mínimos por módulo</text>
  <text x="78" y="776" class="warningText">• ningún UPDATE cruzado</text>
  <text x="78" y="799" class="warningText">• contratos REST estables</text>
  <text x="78" y="822" class="warningText">• auditoría y migraciones</text>
  <path d="M335 690 H390" stroke="#c57b17" stroke-width="3" fill="none" marker-end="url(#arrowWarn)"/>

  <!-- providers arrows -->
  <path d="M335 253 H390" stroke="#2d6c99" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="341" y="239" class="arrowLabel">PAID</text>
  <path d="M335 324 H390" stroke="#2d6c99" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="341" y="310" class="arrowLabel">evento</text>
  <path d="M335 399 H390" stroke="#2d6c99" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="341" y="385" class="arrowLabel">adaptado</text>

  <text x="70" y="945" class="small">Nota: la base compartida se representa como una restricción operativa. La separación lógica, los roles y los contratos reducen el acoplamiento, pero no eliminan el riesgo de una base común.</text>
</svg>
